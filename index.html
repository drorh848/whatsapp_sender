<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שליחת הזמנות | חינה חמרי</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9963a; --gold-light: #e8c06a; --gold-dark: #8a6020;
    --deep: #1a0e05; --warm: #2d1a08; --cream: #fdf6e8;
    --henna: #7a2e0e; --henna-light: #c4622d; --success: #27ae60; --wa: #25D366;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Serif Hebrew',serif; background:var(--deep); color:var(--cream); min-height:100vh; }
  .bg { position:fixed; inset:0; background: radial-gradient(ellipse at 30% 20%, rgba(201,150,58,0.07) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(122,46,14,0.1) 0%, transparent 50%), var(--deep); z-index:0; }
  .container { position:relative; z-index:1; max-width:540px; margin:0 auto; padding:24px 16px; }
  .page { display:none; } .page.active { display:block; animation:fadeIn 0.4s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .app-header { text-align:center; margin-bottom:24px; }
  .app-title { font-size:20px; color:var(--gold-light); font-weight:700; margin-bottom:4px; }
  .app-subtitle { font-size:12px; color:rgba(253,246,232,0.4); letter-spacing:2px; }
  .user-badge { display:inline-block; margin-top:10px; padding:6px 16px; background:rgba(201,150,58,0.15); border:1px solid rgba(201,150,58,0.3); border-radius:20px; font-size:13px; color:var(--gold-light); }
  .gold-line { height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:16px 0; }
  .form-group { margin-bottom:16px; }
  .form-label { display:block; font-size:12px; color:var(--gold); letter-spacing:2px; margin-bottom:6px; }
  .form-input { width:100%; padding:13px 16px; background:rgba(255,255,255,0.05); border:1px solid rgba(201,150,58,0.3); border-radius:3px; color:var(--cream); font-family:'Noto Serif Hebrew',serif; font-size:15px; outline:none; transition:border-color 0.2s; }
  .form-input:focus { border-color:var(--gold); background:rgba(201,150,58,0.06); }
  .form-input::placeholder { color:rgba(253,246,232,0.25); }
  .error-msg { color:var(--henna-light); font-size:13px; margin-top:8px; display:none; }
  .btn { width:100%; padding:14px; border:none; border-radius:3px; font-family:'Noto Serif Hebrew',serif; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; letter-spacing:1px; }
  .btn-gold { background:linear-gradient(135deg,var(--gold-dark),var(--gold)); color:var(--deep); box-shadow:0 4px 15px rgba(201,150,58,0.3); }
  .btn-gold:hover { transform:translateY(-1px); }
  .btn-outline { background:transparent; border:1px solid rgba(201,150,58,0.3); color:rgba(253,246,232,0.5); font-size:13px; padding:10px; }
  .btn-outline:hover { border-color:var(--gold); color:var(--gold); }
  .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
  .stat-box { background:rgba(201,150,58,0.08); border:1px solid rgba(201,150,58,0.2); border-radius:4px; padding:12px 8px; text-align:center; }
  .stat-num { font-size:26px; color:var(--gold-light); font-weight:700; line-height:1; }
  .stat-label { font-size:10px; color:rgba(253,246,232,0.4); letter-spacing:1px; margin-top:4px; }
  .filter-row { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filter-btn { padding:8px 14px; background:rgba(255,255,255,0.04); border:1px solid rgba(201,150,58,0.2); border-radius:20px; color:rgba(253,246,232,0.5); font-family:'Noto Serif Hebrew',serif; font-size:13px; cursor:pointer; transition:all 0.2s; }
  .filter-btn.active { background:rgba(201,150,58,0.2); border-color:var(--gold); color:var(--gold-light); }
  .section-title { font-size:11px; letter-spacing:3px; color:var(--gold); margin-bottom:10px; opacity:0.8; }
  .guests-list { display:flex; flex-direction:column; gap:8px; }
  .guest-item { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:rgba(255,255,255,0.03); border:1px solid rgba(201,150,58,0.1); border-radius:4px; gap:10px; }
  .guest-item.sent { border-color:rgba(37,211,102,0.3); background:rgba(37,211,102,0.04); }
  .guest-info { flex:1; min-width:0; }
  .guest-name { font-size:15px; color:var(--cream); }
  .guest-meta { font-size:11px; color:rgba(253,246,232,0.35); margin-top:2px; }
  .btn-wa { display:flex; align-items:center; gap:6px; padding:10px 14px; background:var(--wa); border:none; border-radius:3px; color:white; font-family:'Noto Serif Hebrew',serif; font-size:13px; cursor:pointer; transition:all 0.2s; white-space:nowrap; flex-shrink:0; }
  .btn-wa:hover { background:#20ba5a; transform:translateY(-1px); }
  .sent-badge { font-size:11px; color:#a9dfbf; white-space:nowrap; }
  .empty-state { text-align:center; padding:40px; color:rgba(253,246,232,0.25); font-size:13px; letter-spacing:1px; }
  .loading { text-align:center; padding:30px; color:var(--gold); font-size:13px; letter-spacing:2px; }
  .msg-preview { background:rgba(37,211,102,0.06); border:1px solid rgba(37,211,102,0.2); border-radius:6px; padding:16px; margin-bottom:20px; font-size:14px; line-height:1.8; color:rgba(253,246,232,0.8); direction:rtl; white-space:pre-line; }
  .msg-label { font-size:11px; letter-spacing:2px; color:#a9dfbf; margin-bottom:8px; }
  .progress-bar-bg { background:rgba(255,255,255,0.06); border-radius:10px; height:6px; margin-bottom:6px; overflow:hidden; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--gold-dark),var(--gold)); border-radius:10px; transition:width 0.3s; }
  .progress-text { font-size:12px; color:rgba(253,246,232,0.4); text-align:center; margin-bottom:16px; }
  .logout-btn { text-align:center; font-size:11px; color:rgba(253,246,232,0.2); cursor:pointer; margin-top:20px; letter-spacing:1px; }
  .logout-btn:hover { color:rgba(253,246,232,0.5); }
  .login-card { background:rgba(255,255,255,0.03); border:1px solid rgba(201,150,58,0.2); border-radius:6px; padding:28px 24px; text-align:center; }
  .login-icon { font-size:40px; margin-bottom:16px; }
  .login-title { font-size:20px; color:var(--gold-light); margin-bottom:4px; }
  .login-sub { font-size:12px; color:rgba(253,246,232,0.4); margin-bottom:24px; letter-spacing:1px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--success); color:white; padding:12px 24px; border-radius:4px; font-size:14px; z-index:100; transition:transform 0.3s; white-space:nowrap; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.err { background:var(--henna-light); }
  .guests-list::-webkit-scrollbar { width:3px; }
  .guests-list::-webkit-scrollbar-thumb { background:rgba(201,150,58,0.3); border-radius:2px; }
</style>
</head>
<body>
<div class="bg"></div>

<div class="container">

  <!-- LOGIN -->
  <div class="page active" id="page-login">
    <div class="app-header">
      <div class="app-title">שליחת הזמנות WhatsApp</div>
      <div class="app-subtitle">חינה | אמרי וליטל חמרי</div>
    </div>
    <div class="login-card">
      <div class="login-icon">📲</div>
      <div class="login-title">כניסה למערכת</div>
      <div class="login-sub">רק לאמרי ולליטל</div>
      <div class="form-group">
        <label class="form-label">שם</label>
        <input class="form-input" id="loginName" type="text" placeholder="אמרי / ליטל"
          onkeydown="if(event.key==='Enter') document.getElementById('loginCode').focus()" />
      </div>
      <div class="form-group">
        <label class="form-label">קוד אישי</label>
        <input class="form-input" id="loginCode" type="password" inputmode="numeric"
          placeholder="קוד מספרי" onkeydown="if(event.key==='Enter') doLogin()" />
        <div class="error-msg" id="loginError">❌ שם או קוד שגוי</div>
      </div>
      <button class="btn btn-gold" onclick="doLogin()">כניסה ←</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="page" id="page-main">
    <div class="app-header">
      <div class="app-title">📲 שליחת הזמנות</div>
      <div class="app-subtitle">חינה | אמרי וליטל חמרי</div>
      <div class="user-badge" id="userBadge">👤</div>
    </div>

    <div class="msg-label" id="msgLabel">✉️ נוסח ההודעה</div>
    <div class="msg-preview" id="msgPreview"></div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">סה"כ</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statSent" style="color:#a9dfbf;">0</div>
        <div class="stat-label">נשלח</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statConfirmed" style="color:var(--purple-light);">0</div>
        <div class="stat-label">אישרו</div>
      </div>
    </div>

    <div class="progress-bar-bg">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 0 נשלחו</div>

    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('all', this)">הכל</button>
      <button class="filter-btn" onclick="setFilter('not_sent', this)">📤 לא נשלח</button>
      <button class="filter-btn" onclick="setFilter('waiting', this)">⏳ ממתין</button>
      <button class="filter-btn" onclick="setFilter('confirmed', this)">✅ אישר</button>
      <button class="filter-btn" onclick="setFilter('declined', this)">❌ לא מגיע</button>
    </div>

    <div class="section-title">רשימת מוזמנים</div>
    <div class="guests-list" id="guestsList">
      <div class="loading">טוען רשימה...</div>
    </div>

    <div class="gold-line" style="margin-top:20px;"></div>
    <button class="btn btn-outline" onclick="resetAll()" style="margin-top:10px;">🔄 אפס סימוני שליחה</button>
    <div class="logout-btn" onclick="doLogout()">⬅ יציאה</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAMRwapWhuzScVtatbQhykIGMldgEacndQ",
    authDomain: "henna-hamri.firebaseapp.com",
    databaseURL: "https://henna-hamri-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "henna-hamri",
    storageBucket: "henna-hamri.firebasestorage.app",
    messagingSenderId: "578518609000",
    appId: "1:578518609000:web:1726b2dc107a7e716d9fdd"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  window._db            = db;
  window._ref           = ref;
  window._onValue       = onValue;
  window._set           = set;
  window._remove        = remove;
  window._firebaseReady = true;
  window.dispatchEvent(new Event('firebaseReady'));
</script>

<script>
  const USERS = {
    "אמרי": { code: "9325" },
    "ליטל": { code: "7236" }
  };

  const INVITE_LINK = "https://drorh848.github.io/hina-hamri/";

  // קישור אישי לכל מוזמן — הטופס ייפתח אצלו עם שם וטלפון ממולאים
  function inviteLinkFor(guestId) {
    return guestId ? `${INVITE_LINK}?g=${guestId}` : INVITE_LINK;
  }

  function buildMsg(guestId, isReminder) {
    const link = inviteLinkFor(guestId);
    return isReminder
      ? `💜 היי!
שלחנו לך הזמנה לחינה של אמרי & ליטל
עדיין לא קיבלנו ממך אישור הגעה 😊
נשמח לדעת! לאישור: ${link}`
      : `💜 אמרי & ליטל 💜
שמחים להזמינכם לחגוג עמנו
את ערב החינה
לצפייה בהזמנה: ${link}`;
  }

  // נוסחים לתצוגה מקדימה בלבד
  const MSG          = buildMsg(null, false);
  const MSG_REMINDER = buildMsg(null, true);

  let currentUser = null;
  let allGuests   = [];
  let groups      = [];   // מקובצים לפי טלפון — הודעה אחת לכל מספר
  let sentMap     = {};
  let rsvpMap     = {};   // לפי טלפון מקומי
  let rsvpById    = {};   // לפי מזהה אישי — מדויק יותר
  let currentFilter = 'all';

  // ===== קיבוץ לפי טלפון =====
  // כמה בני משפחה עם אותו מספר = הודעה אחת בלבד.
  // מוזמן ללא טלפון = קבוצה נפרדת משלו, מסומנת ככזו.
  function buildGroups() {
    const byPhone = new Map();
    const result  = [];

    for (const g of allGuests) {
      const p = normalizePhone(g.phone);
      if (!p) {
        result.push({ key: 'nophone_' + g.id, phone: '', members: [g], noPhone: true });
        continue;
      }
      if (!byPhone.has(p)) {
        const grp = { key: 'p_' + p, phone: p, members: [], noPhone: false };
        byPhone.set(p, grp);
        result.push(grp);
      }
      byPhone.get(p).members.push(g);
    }

    for (const grp of result) {
      grp.names     = grp.members.map(m => m.name).join(', ');
      grp.primaryId = grp.members[0].id;
      grp.side      = [...new Set(grp.members.map(m => m.side))].join(' · ');
      grp.category  = [...new Set(grp.members.map(m => m.category).filter(Boolean))].join(' · ');
    }
    groups = result;
  }

  function isGroupSent(grp) {
    return grp.members.some(m => sentMap[m.id]);
  }

  function groupRsvp(grp) {
    for (const m of grp.members) {
      if (rsvpById[m.id]) return rsvpById[m.id];
    }
    return grp.phone ? rsvpMap[grp.phone] : null;
  }

  // ===== LOGIN =====
  function doLogin() {
    const name = document.getElementById('loginName').value.trim();
    const code = document.getElementById('loginCode').value.trim();
    const err  = document.getElementById('loginError');
    const user = USERS[name];
    if (user && user.code === code) {
      err.style.display = 'none';
      currentUser = name;
      document.getElementById('loginCode').value = '';
      startSession();
    } else {
      err.style.display = 'block';
    }
  }
  window.doLogin = doLogin;

  function doLogout() {
    currentUser = null; allGuests = []; sentMap = {};
    document.getElementById('loginName').value = '';
    showPage('page-login');
  }
  window.doLogout = doLogout;

  function startSession() {
    document.getElementById('userBadge').textContent = `👤 ${currentUser}`;
    updateMsgPreview();
    showPage('page-main');
    loadData();
  }

  // ===== LOAD DATA =====
  function loadData() {
    if (!window._firebaseReady) {
      window.addEventListener('firebaseReady', loadData, { once: true });
      return;
    }

    const keyToName = {
      amri: 'אמרי', lital: 'ליטל', dror: 'דרור',
      bracha: 'ברכה', shoshana: 'שושי', shai: 'שי'
    };

    // מוזמנים מניהול המוזמנים
    const guestsRef = window._ref(window._db, 'guests');
    window._onValue(guestsRef, (snap) => {
      const data = snap.val() || {};
      allGuests = [];
      for (const [userKey, userGuests] of Object.entries(data)) {
        if (!userGuests) continue;
        for (const [id, g] of Object.entries(userGuests)) {
          if (g && g.name) {
            allGuests.push({
              id: userKey + '_' + id,
              fireKey: id, userKey,
              name: g.name, phone: g.phone || '',
              category: g.category || '',
              side: keyToName[userKey] || userKey
            });
          }
        }
      }
      allGuests.sort((a, b) => a.name.localeCompare(b.name, 'he'));
      buildGroups();
      renderGuests();
      updateStats();
    });

    // סימוני שליחה
    const sentRef = window._ref(window._db, 'wa_sent');
    window._onValue(sentRef, (snap) => {
      sentMap = snap.val() || {};
      renderGuests();
      updateStats();
    });

    // אישורי הגעה מדף החתונה
    const rsvpRef = window._ref(window._db, 'henna_rsvp');
    window._onValue(rsvpRef, (snap) => {
      const data = snap.val() || {};
      rsvpMap  = {};
      rsvpById = {};
      for (const [key, entry] of Object.entries(data)) {
        if (!entry) continue;
        const rec = { attending: entry.attending, guests: entry.guests || 0 };
        // שיוך ודאי לפי מזהה אישי (המפתח עצמו הוא המזהה כשנשלח קישור אישי)
        const gid = entry.guestId || (key.includes('_') ? key : null);
        if (gid) rsvpById[gid] = rec;
        if (entry.phone) rsvpMap[normalizePhone(entry.phone)] = rec;
      }
      renderGuests();
      updateStats();
    });
  }

  // ===== STATUS =====
  function getStatus(grp) {
    if (!isGroupSent(grp)) return 'not_sent';
    const rsvp = groupRsvp(grp);
    if (!rsvp) return 'waiting';
    return rsvp.attending ? 'confirmed' : 'declined';
  }

  // ===== RENDER =====
  function renderGuests() {
    const list = document.getElementById('guestsList');
    let filtered = groups;
    if (currentFilter !== 'all') {
      filtered = groups.filter(grp => getStatus(grp) === currentFilter);
    }

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state">אין מוזמנים להצגה</div>';
      return;
    }

    list.innerHTML = filtered.map(grp => {
      const isSent = isGroupSent(grp);
      const many   = grp.members.length > 1;
      const meta   = grp.noPhone
        ? `⚠️ ללא טלפון · ${grp.side}`
        : `${grp.members[0].phone} · ${grp.side}${grp.category ? ' · ' + grp.category : ''}`;
      const title  = many
        ? `${grp.names} <span style="opacity:.6;font-size:12px;">(${grp.members.length} רשומות · מספר משותף)</span>`
        : grp.names;

      let action;
      if (grp.noPhone) {
        action = isSent
          ? `<span class="sent-badge">✅ סומן</span>`
          : `<button class="btn-wa" style="background:#6b6b6b" onclick="markSent('${grp.key}')">
               <span>✍️</span> סמן ידנית
             </button>`;
      } else if (isSent && currentFilter === 'waiting') {
        action = `<button class="btn-wa" style="background:var(--gold-dark)" onclick="sendInvite('${grp.key}')">
                    <span>⏳</span> שלח תזכורת
                  </button>`;
      } else if (isSent) {
        action = `<span class="sent-badge">✅ נשלח</span>`;
      } else {
        action = `<button class="btn-wa" onclick="sendInvite('${grp.key}')">
                    <span>📲</span> שלח
                  </button>`;
      }

      return `
        <div class="guest-item ${isSent ? 'sent' : ''}" id="item-${grp.key}">
          <div class="guest-info">
            <div class="guest-name">${title}</div>
            <div class="guest-meta">${meta}</div>
          </div>
          ${action}
        </div>`;
    }).join('');
  }

  // ===== SEND =====
  async function markMembersSent(grp) {
    for (const m of grp.members) sentMap[m.id] = true;
    renderGuests();
    updateStats();
    if (!window._firebaseReady) return;
    for (const m of grp.members) {
      await window._set(window._ref(window._db, 'wa_sent/' + m.id), true);
    }
  }

  function suggestNext() {
    const next = groups.find(g => !isGroupSent(g) && !g.noPhone);
    if (next) showToast(`הבא: ${next.members[0].name} ←`);
    else showToast('🎉 כולם קיבלו הזמנה!');
  }

  async function sendInvite(groupKey) {
    const grp = groups.find(g => g.key === groupKey);
    if (!grp) return;

    const isReminder = currentFilter === 'waiting';
    const msgEnc = encodeURIComponent(buildMsg(grp.primaryId, isReminder));
    const phoneIntl = normalizePhone(grp.members[0].phone, true);
    const waLink = phoneIntl
      ? `https://wa.me/${phoneIntl}?text=${msgEnc}`
      : `https://wa.me/?text=${msgEnc}`;

    // תיקון iOS/Safari: פתיחת WhatsApp מיד בלחיצה — לפני כל await,
    // אחרת ספארי חוסם את הפתיחה כפופאפ
    window.open(waLink, '_blank');

    await markMembersSent(grp);
    showToast(isReminder ? '⏳ תזכורת נשלחה!' : '✅ סומן כנשלח!');
    setTimeout(suggestNext, 1000);
  }
  window.sendInvite = sendInvite;

  // סימון ידני — למוזמן ללא טלפון, אחרי שנוצר איתו קשר בדרך אחרת
  async function markSent(groupKey) {
    const grp = groups.find(g => g.key === groupKey);
    if (!grp) return;
    if (!confirm(`לסמן את ${grp.names} כמי שקיבל/ה הזמנה?`)) return;
    await markMembersSent(grp);
    showToast('✅ סומן');
  }
  window.markSent = markSent;

  // ===== RESET =====
  async function resetAll() {
    if (!confirm('האם אתה בטוח?\nפעולה זו תמחק את כל סימוני השליחה.')) return;
    if (!confirm('⚠️ אם תאפס ותשלח שוב — אנשים יקבלו הזמנה כפולה.\nלהמשיך?')) return;
    const sentRef = window._ref(window._db, 'wa_sent');
    await window._remove(sentRef);
    showToast('🔄 אופסו כל הסימונים');
  }
  window.resetAll = resetAll;

  // ===== STATS =====
  function updateStats() {
    const sendable  = groups.filter(g => !g.noPhone);
    const noPhone   = groups.filter(g => g.noPhone).length;
    const total     = sendable.length;
    const sent      = sendable.filter(isGroupSent).length;
    const confirmed = groups.filter(g => getStatus(g) === 'confirmed').length;

    document.getElementById('statTotal').textContent     = allGuests.length;
    document.getElementById('statSent').textContent      = sent;
    document.getElementById('statConfirmed').textContent = confirmed;

    const pct = total > 0 ? Math.round(sent / total * 100) : 0;
    document.getElementById('progressBar').style.width  = pct + '%';
    document.getElementById('progressText').textContent =
      `${sent} / ${total} מספרים נשלחו (${pct}%)` +
      (noPhone ? ` · ${noPhone} ללא טלפון` : '');
  }

  // ===== FILTER =====
  function updateMsgPreview() {
    const isReminder = currentFilter === 'waiting';
    document.getElementById('msgPreview').textContent = isReminder ? MSG_REMINDER : MSG;
    document.getElementById('msgLabel').textContent   = isReminder ? '⏳ נוסח תזכורת' : '✉️ נוסח ההודעה';
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateMsgPreview();
    renderGuests();
  }
  window.setFilter = setFilter;

  // ===== NORMALIZE PHONE =====
  // ברירת מחדל: פורמט מקומי (05...) — לצורך השוואות.
  // intl=true: פורמט בינלאומי (9725...) — לצורך קישורי וואטסאפ.
  function normalizePhone(p, intl = false) {
    if (!p) return '';
    let n = p.replace(/[-\s().+]/g, '').replace(/[oO]/g, '0');
    if (n.startsWith('972')) n = '0' + n.slice(3);
    if (intl) return n.startsWith('0') ? '972' + n.slice(1) : n;
    return n;
  }

  // ===== NAVIGATION =====
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  // ===== TOAST =====
  function showToast(msg, isErr = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = 'toast' + (isErr ? ' err' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  document.getElementById('loginName').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loginCode').focus();
  });
</script>
</body>
</html>
